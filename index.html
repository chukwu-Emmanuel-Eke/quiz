<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz app</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
             width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items:center;
            justify-content: center;
        }
        .container{
            width: 80%;
            height: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
             background:linear-gradient(95deg, blue,rgb(163, 10, 36),blue);
            border-radius:30px;
            margin: 1rem;
            padding: 3rem;
            position: fixed;
            top: 0;
            box-shadow: 20px 20px  0 white;
        }
        #previous{
         color:   rgba(182, 5, 64, 0.856);
         width: 100px;
         height: 50px;
         border-radius: 20px;
         border: 2px solid rgba(182, 5, 64, 0.856);
         cursor: pointer;
        font-weight: 900;
        }
        #next{
         color: rgba(182, 5, 64, 0.856);
         width: 100px;
         height: 50px;
         border-radius: 20px;
          border: 2px solid rgba(182, 5, 64, 0.856);
         cursor: pointer;
         font-weight: 900;
        }
    .control{
        display:flex;
        justify-content: space-between;
    }
    h2,h3{
        color: whitesmoke;
    }
    #option{
        display: flex;
        flex-direction: column;
        color: whitesmoke;
        font: 1rem sans-serif;
    }
  @media (max-width:379px) {
    #previous, #next{
         width: 70px;
         height: 30px;
         border-radius: 20px;
         border: none;
         cursor: pointer;
        font-weight: 600;
    }
     #option{
        display: flex;
        flex-direction: column;
        color: whitesmoke;
        font: 0.5rem sans-serif;
    }
    h2{
        font-size: small;
    }

  }
    </style>
</head>
<body>
    <div class="container">
        <h3 id="questionNumber"></h3>
        <h2 id="question"></h2>
        <div id="option"></div>
        <div class="control">
            <button id="previous">previous</button>
            <button id="next">next</button>
        </div>
    </div>
  <script src="quiz.js"></script>
  <script src="quiz-back.js"></script>
</body>
</html>
